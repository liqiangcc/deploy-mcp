name: Phase 8 Source Export

on:
  push:
    branches:
      - feat/v0.2-deployment-mechanism-port

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: phase8-source
          path: .
          include-hidden-files: true
          retention-days: 1
