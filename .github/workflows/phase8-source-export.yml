name: Phase 8 Source Export

on:
  push:
    branches:
      - feat/v0.2-generic-deployment-model
    paths:
      - .github/workflows/phase8-source-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export source tree
        uses: actions/upload-artifact@v4
        with:
          name: deploy-mcp-source
          path: |
            .
            !target
            !.git
          include-hidden-files: true
          retention-days: 1
