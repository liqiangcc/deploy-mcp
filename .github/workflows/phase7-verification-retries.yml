        install_path: /tmp/install.jar
        backup_path: /tmp/backup.jar
        tasks:
          backup: backup
          install: install
          restart: restart
          health_check: health
"#;
    assert_eq!(
        Config::from_yaml(zero_attempts).unwrap_err().code,
        ErrorCode::InvalidConfiguration
    );

    let too_many = zero_attempts.replace("verification_max_attempts: 0", "verification_max_attempts: 11");
    assert_eq!(
        Config::from_yaml(&too_many).unwrap_err().code,
        ErrorCode::InvalidConfiguration
    );

    let too_slow = zero_attempts
        .replace("verification_max_attempts: 0", "verification_max_attempts: 3")
        .replace("runtime:\n", "runtime:\n  verification_retry_delay_ms: 60001\n");
    assert_eq!(
        Config::from_yaml(&too_slow).unwrap_err().code,
        ErrorCode::InvalidConfiguration
    );
}
