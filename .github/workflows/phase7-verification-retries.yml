        run: |
          rm .github/workflows/phase7-verification-retries.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/config.rs \
            src/application/deploy.rs \
            src/application/rollback.rs \
            config/example.yaml \
            ROADMAP.md \
            docs/VERIFICATION_RETRIES.md \
            tests/verification_retries.rs \
            .github/workflows/phase7-verification-retries.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "feat: add deterministic verification retries"
          git push origin HEAD:docs/v0.1-design
