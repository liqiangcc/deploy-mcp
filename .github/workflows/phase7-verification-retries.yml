name: Phase 7 verification retry hardening

on:
  push:
    branches:
      - docs/v0.1-design
    paths:
      - .github/workflows/phase7-verification-retries.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/v0.1-design
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply deterministic verification retries
        run: |
          python3 .github/scripts/phase7_verification_retries.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features
      - name: Commit verified retry hardening
        run: |
          rm .github/workflows/phase7-verification-retries.yml
          rm .github/scripts/phase7_verification_retries.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/config.rs \
            src/application/deploy.rs \
            src/application/rollback.rs \
            config/example.yaml \
            ROADMAP.md \
            docs/VERIFICATION_RETRIES.md \
            tests/verification_retries.rs \
            .github/workflows/phase7-verification-retries.yml \
            .github/scripts/phase7_verification_retries.py
          git diff --cached --check
          git diff --cached --stat
          git commit -m "feat: add deterministic verification retries"
          git push origin HEAD:docs/v0.1-design
