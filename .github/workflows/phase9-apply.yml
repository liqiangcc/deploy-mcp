name: Phase 9 Apply And Validate

on:
  push:
    branches:
      - feat/v0.2-docker-compose-mechanism
    paths:
      - .github/workflows/phase9-apply.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Reconstruct and apply Phase 9 implementation
        run: |
          set -euo pipefail
          cat .phase9/part01.txt .phase9/part02.txt .phase9/part03.txt .phase9/part04.txt .phase9/part05.txt .phase9/part06.txt .phase9/part07.txt | base64 -d | gzip -d > /tmp/phase9.patch
          git apply --check /tmp/phase9.patch
          git apply /tmp/phase9.patch
          cat .phase9/delta01.txt .phase9/delta02.txt .phase9/delta03.txt | base64 -d | gzip -d > /tmp/phase9-delta.patch
          git apply --check /tmp/phase9-delta.patch
          git apply /tmp/phase9-delta.patch
          base64 -d .phase9/fix-newlines.txt | gzip -d > /tmp/phase9-newline-fix.patch
          git apply --check /tmp/phase9-newline-fix.patch
          git apply /tmp/phase9-newline-fix.patch
          base64 -d .phase9/fix-lints.txt | gzip -d > /tmp/phase9-lint-fix.patch
          git apply --check /tmp/phase9-lint-fix.patch
          git apply /tmp/phase9-lint-fix.patch
          base64 -d .phase9/fix-tests.txt | gzip -d > /tmp/phase9-test-fix.patch
          git apply --check /tmp/phase9-test-fix.patch
          git apply /tmp/phase9-test-fix.patch
          cp .phase9/migration007.sql migrations/007_deployment_rollback_capture.sql
          git diff --check
      - name: Format
        run: cargo fmt --all
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy locked
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test locked
        run: cargo test --locked --all-features
      - name: Remove temporary implementation helpers
        run: |
          rm -rf .phase9
          rm -f .github/workflows/phase9-source-export.yml
          rm -f .github/workflows/phase9-apply.yml
      - name: Stage only confirmed Phase 9 paths
        run: |
          set -euo pipefail
          git add -- \
            migrations/007_deployment_rollback_capture.sql \
            src/application/api.rs \
            src/application/deploy.rs \
            src/application/mechanism.rs \
            src/application/mod.rs \
            src/config.rs \
            src/domain/deployment.rs \
            src/domain/mod.rs \
            src/domain/rollback.rs \
            src/mcp.rs \
            src/persistence.rs \
            src/ports.rs \
            src/recovery_persistence.rs \
            src/rollback_persistence.rs \
            .phase9/phase9.patch.gz.b64 \
            .phase9/part01.txt .phase9/part02.txt .phase9/part03.txt .phase9/part04.txt \
            .phase9/part05.txt .phase9/part06.txt .phase9/part07.txt \
            .phase9/delta01.txt .phase9/delta02.txt .phase9/delta03.txt \
            .phase9/fix-newlines.txt .phase9/fix-lints.txt .phase9/fix-tests.txt .phase9/migration007.sql \
            .github/workflows/phase9-source-export.yml \
            .github/workflows/phase9-apply.yml
          git diff --cached --check
          actual=$(git diff --cached --name-only | sort)
          expected=$(printf '%s\n' \
            '.github/workflows/phase9-apply.yml' \
            '.github/workflows/phase9-source-export.yml' \
            '.phase9/delta01.txt' '.phase9/delta02.txt' '.phase9/delta03.txt' \
            '.phase9/fix-newlines.txt' '.phase9/fix-lints.txt' '.phase9/fix-tests.txt' '.phase9/migration007.sql' '.phase9/phase9.patch.gz.b64' \
            '.phase9/part01.txt' '.phase9/part02.txt' '.phase9/part03.txt' '.phase9/part04.txt' \
            '.phase9/part05.txt' '.phase9/part06.txt' '.phase9/part07.txt' \
            'migrations/007_deployment_rollback_capture.sql' \
            'src/application/api.rs' 'src/application/deploy.rs' 'src/application/mechanism.rs' \
            'src/application/mod.rs' 'src/config.rs' 'src/domain/deployment.rs' 'src/domain/mod.rs' 'src/domain/rollback.rs' \
            'src/mcp.rs' 'src/persistence.rs' 'src/ports.rs' 'src/recovery_persistence.rs' \
            'src/rollback_persistence.rs' | sort)
          test "$actual" = "$expected"
      - name: Commit and push validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add docker compose deployment mechanism"
          git push origin HEAD:feat/v0.2-docker-compose-mechanism
