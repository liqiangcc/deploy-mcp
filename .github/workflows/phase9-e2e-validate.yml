name: Phase 9 E2E Validation

on:
  push:
    branches:
      - feat/v0.2-docker-compose-mechanism
    paths:
      - .github/workflows/phase9-e2e-validate.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install SSH server
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
      - name: Checkout pinned remote-exec-mcp
        uses: actions/checkout@v4
        with:
          repository: liqiangcc/remote-exec-mcp
          ref: 92da5d6ba86e0c095478d36a1092e321e29bfb9c
          path: remote-exec-mcp
          persist-credentials: false
      - name: Format and validate Rust
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-features
      - name: Build pinned remote-exec-mcp
        run: cargo build --locked --release --manifest-path remote-exec-mcp/Cargo.toml
      - name: Prepare real systemd target
        run: bash scripts/e2e/setup_real_systemd_target.sh
      - name: Real systemd regression
        env:
          DEPLOY_MCP_REAL_E2E: '1'
          DEPLOY_MCP_E2E_REMOTE_EXEC_BIN: ${{ github.workspace }}/remote-exec-mcp/target/release/remote-exec-mcp
        run: cargo test --locked --test real_systemd_e2e -- --nocapture
      - name: Verify Docker Compose
        run: |
          docker version
          docker compose version
      - name: Prepare real Docker Compose target
        run: bash scripts/e2e/setup_real_docker_compose_target.sh
      - name: Real Docker Compose acceptance
        env:
          DEPLOY_MCP_REAL_DOCKER_E2E: '1'
          DEPLOY_MCP_E2E_REMOTE_EXEC_BIN: ${{ github.workspace }}/remote-exec-mcp/target/release/remote-exec-mcp
        run: cargo test --locked --test real_docker_compose_e2e -- --nocapture
      - name: Remove temporary validation workflow
        run: rm -f .github/workflows/phase9-e2e-validate.yml
      - name: Stage exact permanent test scope
        run: |
          set -euo pipefail
          git add -- \
            .github/workflows/e2e-real-docker-compose.yml \
            scripts/e2e/setup_real_docker_compose_target.sh \
            tests/docker_compose.rs \
            tests/real_docker_compose_e2e.rs \
            .github/workflows/phase9-e2e-validate.yml
          git diff --cached --check
          git diff --cached --name-only | sort | tee /tmp/staged
          for required in \
            .github/workflows/e2e-real-docker-compose.yml \
            scripts/e2e/setup_real_docker_compose_target.sh \
            tests/docker_compose.rs \
            tests/real_docker_compose_e2e.rs \
            .github/workflows/phase9-e2e-validate.yml; do
            grep -Fxq "$required" /tmp/staged || { echo "missing staged path: $required" >&2; exit 1; }
          done
          test "$(wc -l < /tmp/staged)" -eq 5
      - name: Commit validated Docker regression coverage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: cover docker compose deployment mechanism"
          git push origin HEAD:feat/v0.2-docker-compose-mechanism
      - name: Diagnostics on failure
        if: failure()
        run: |
          set +e
          echo '=== docker ps ==='
          docker ps -a
          echo '=== current Compose env ==='
          cat /home/deploy/docker/.env 2>/dev/null
          echo '=== running version ==='
          cat /home/deploy/docker/state/running-version 2>/dev/null
          echo '=== compose ps ==='
          docker compose -p deploy-mcp-e2e -f /home/deploy/docker/compose.yml --env-file /home/deploy/docker/.env ps
          echo '=== compose logs ==='
          docker compose -p deploy-mcp-e2e -f /home/deploy/docker/compose.yml --env-file /home/deploy/docker/.env logs --no-color
          echo '=== Docker remote-exec audit ==='
          if [[ -n "${DEPLOY_MCP_DOCKER_E2E_REMOTE_EXEC_AUDIT:-}" ]]; then cat "$DEPLOY_MCP_DOCKER_E2E_REMOTE_EXEC_AUDIT"; fi
          echo '=== Docker sshd ==='
          if [[ -n "${DEPLOY_MCP_DOCKER_E2E_WORK_ROOT:-}" ]]; then cat "$DEPLOY_MCP_DOCKER_E2E_WORK_ROOT/sshd.log" 2>/dev/null; fi
          echo '=== systemd service ==='
          sudo systemctl status deploy-mcp-e2e.service --no-pager
          exit 0
